name: Travel Radar Scheduled Monitor

on:
  schedule:
    # 每日台灣時間 09:17 與 21:17 執行巡檢 (UTC 01:17 與 13:17，避開整點尖峰隊列)
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      trip:
        description: '指定旅遊專案 ID (預設 all 掃描全部啟用專案)'
        required: false
        default: 'all'
      skip_llm:
        description: '是否略過詳情頁 LLM 解析'
        type: boolean
        default: false
      no_playwright:
        description: '是否停用 Playwright 降級（僅跑 httpx XHR/SSR）'
        type: boolean
        default: false
      notify:
        description: '是否發送緊急告警推播'
        type: boolean
        default: true
      digest:
        description: '無重大異動時是否發送每日健康心跳摘要'
        type: boolean
        default: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        if: ${{ inputs.no_playwright != true }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (When Fallback Enabled)
        if: ${{ inputs.no_playwright != true }}
        run: |
          playwright install --with-deps chromium

      - name: Initialize / Migrate Database
        run: |
          python -m src.cli init-db --db-path data/radar.db

      - name: Run Travel Radar Scan
        env:
          DATABASE_PATH: data/radar.db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--db-path data/radar.db"
          if [ "${{ inputs.trip || 'all' }}" = "all" ]; then
            ARGS="$ARGS --all"
          else
            ARGS="$ARGS --trip ${{ inputs.trip }}"
          fi
          if [ "${{ inputs.skip_llm }}" = "true" ]; then
            ARGS="$ARGS --skip-llm"
          fi
          if [ "${{ inputs.no_playwright }}" = "true" ]; then
            ARGS="$ARGS --no-playwright"
          fi
          if [ "${{ inputs.notify }}" != "false" ]; then
            ARGS="$ARGS --notify"
          fi
          if [ "${{ inputs.digest }}" != "false" ]; then
            ARGS="$ARGS --digest"
          fi
          python -m src.cli scan $ARGS

      - name: Build Static Web Dashboard Data
        run: |
          python -m src.cli build-web --db-path data/radar.db --output web/data/dashboard.json

      - name: Commit and Push Updated SQLite Database & Web Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar.db web/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No DB or web data changes to commit"
          else
            git commit -m "🤖 [auto] Update travel radar database & dashboard data"
            git push
          fi

  deploy-pages:
    needs: scan-and-notify
    if: needs.scan-and-notify.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Wait for Artifact Indexing
        run: sleep 8

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
